<div class="shell">
  <div class="grid">
    <div class="form-card">
      <div class="field">
        <label>Select model</label>
        <div class="model-picker" id="modelPicker"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>

      <div class="field">
        <label>Weight precision</label>
        <div class="seg-control" id="wtPrecSeg">
          <button class="seg-option" data-value="bf16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>
    </div>

    <div class="result-area">
      <div class="total-display">
        <div class="total-value" id="totalParams">&mdash;</div>
        <div class="total-unit" id="totalBytes"></div>
      </div>
      <div class="unit-selector">
        <button class="unit-btn active" data-unit="gib">GiB</button>
        <button class="unit-btn" data-unit="gb">GB</button>
        <button class="unit-btn" data-unit="mib">MiB</button>
      </div>
      <div class="metrics-compact" id="metricsCompact"></div>
      <div id="formulaSection" class="formula-section hidden">
        <div class="formula-title" id="formulaTitle"></div>
        <div id="formulaBody"></div>
      </div>
      <div class="breakdown" id="breakdownSection">
        <div class="breakdown-title" id="breakdownToggle">Breakdown <span class="breakdown-arrow">▶</span></div>
        <div class="breakdown-list collapsed" id="breakdownGrid"></div>
      </div>
      <div class="note" id="noteSection"></div>
      <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>
