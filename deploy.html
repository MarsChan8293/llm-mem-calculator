      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

<div class="shell">
  <div class="grid">
    <div class="form-card">
      <div class="field">
        <label>Select model</label>
        <div class="model-picker" id="modelPicker"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>

      <div class="field">
        <label>Weight precision</label>
        <div class="seg-control" id="wtPrecSeg">
          <button class="seg-option" data-value="bf16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field">
        <label>KV precision</label>
        <div class="seg-control" id="kvPrecSeg">
          <button class="seg-option" data-value="bf16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field" id="idxPrecField" style="display:none">
        <label>Indexer precision</label>
        <div class="seg-control" id="idxPrecSeg">
          <button class="seg-option" data-value="bf16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field">
        <label>Context length</label>
        <input class="text-input" type="number" id="ctxInput" value="8192" min="1" step="1">
        <div class="preset-row" id="ctxPresets">
          <button class="preset-btn" data-value="1024">1K</button>
          <button class="preset-btn" data-value="4096">4K</button>
          <button class="preset-btn active" data-value="8192">8K</button>
          <button class="preset-btn" data-value="32768">32K</button>
          <button class="preset-btn" data-value="131072">128K</button>
          <button class="preset-btn" data-value="524288">512K</button>
          <button class="preset-btn" data-value="1048576">1M</button>
        </div>
      </div>

      <div class="field">
        <label>Batch size</label>
        <div class="preset-row" id="batchPresets">
          <button class="preset-btn active" data-value="1">1</button>
          <button class="preset-btn" data-value="4">4</button>
          <button class="preset-btn" data-value="8">8</button>
          <button class="preset-btn" data-value="32">32</button>
          <button class="preset-btn" data-value="128">128</button>
          <button class="preset-btn" data-value="512">512</button>
        </div>
        <input class="text-input" type="number" id="batchInput" value="1" min="1" step="1" style="margin-top:4px">
      </div>

      <div class="field" id="draftField" style="display:none">
        <label class="toggle-label">
          <input type="checkbox" id="draftToggle"> Include draft KV
        </label>
      </div>

      <div class="field" id="linearField" style="display:none">
        <label class="toggle-label">
          <input type="checkbox" id="linearToggle"> Include linear KV
        </label>
      </div>

      <div class="field-sep"></div>

      <div class="field">
        <label>Serving mode</label>
        <div class="seg-control" id="modeSeg">
          <button class="seg-option active" data-value="unified">Unified</button>
          <button class="seg-option" data-value="disaggregated">Disaggregated</button>
        </div>
      </div>

      <div id="unifiedParallel">
        <div class="field">
          <label>Parallelism</label>
          <div class="parallel-grid">
            <div class="parallel-item">
              <span class="parallel-label">TP</span>
              <input class="text-input parallel-input" type="number" id="tpInput" value="8" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">PP</span>
              <input class="text-input parallel-input" type="number" id="ppInput" value="1" min="1" max="64" step="1">
            </div>
            <div class="parallel-item" id="epItem">
              <span class="parallel-label">EP</span>
              <input class="text-input parallel-input" type="number" id="epInput" value="8" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">CP</span>
              <input class="text-input parallel-input" type="number" id="cpInput" value="1" min="1" max="256" step="1">
            </div>
          </div>
          <div class="parallel-single">
            <span class="parallel-label-wide">Attn DP</span>
            <input class="text-input parallel-input" type="number" id="dpInput" value="1" min="1" max="256" step="1">
          </div>
        </div>
      </div>

      <div id="disaggControls" style="display:none">
        <div class="field">
          <label class="field-sublabel">Prefill</label>
          <div class="parallel-grid">
            <div class="parallel-item">
              <span class="parallel-label">TP</span>
              <input class="text-input parallel-input" type="number" id="prefillTpInput" value="8" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">PP</span>
              <input class="text-input parallel-input" type="number" id="prefillPpInput" value="1" min="1" max="64" step="1">
            </div>
            <div class="parallel-item" id="prefillEpItem">
              <span class="parallel-label">EP</span>
              <input class="text-input parallel-input" type="number" id="prefillEpInput" value="8" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">CP</span>
              <input class="text-input parallel-input" type="number" id="prefillCpInput" value="1" min="1" max="256" step="1">
            </div>
          </div>
          <div class="parallel-single">
            <span class="parallel-label-wide">Attn DP</span>
            <input class="text-input parallel-input" type="number" id="prefillDpInput" value="1" min="1" max="256" step="1">
          </div>
        </div>
        <div class="field">
          <label class="field-sublabel">Decode</label>
          <div class="parallel-grid">
            <div class="parallel-item">
              <span class="parallel-label">TP</span>
              <input class="text-input parallel-input" type="number" id="decodeTpInput" value="2" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">PP</span>
              <input class="text-input parallel-input" type="number" id="decodePpInput" value="1" min="1" max="64" step="1">
            </div>
            <div class="parallel-item" id="decodeEpItem">
              <span class="parallel-label">EP</span>
              <input class="text-input parallel-input" type="number" id="decodeEpInput" value="8" min="1" max="256" step="1">
            </div>
            <div class="parallel-item">
              <span class="parallel-label">CP</span>
              <input class="text-input parallel-input" type="number" id="decodeCpInput" value="1" min="1" max="256" step="1">
            </div>
          </div>
          <div class="parallel-single">
            <span class="parallel-label-wide">Attn DP</span>
            <input class="text-input parallel-input" type="number" id="decodeDpInput" value="1" min="1" max="256" step="1">
          </div>
        </div>
        <div class="field" id="absorptionField" style="display:none">
          <label class="toggle-label">
            <input type="checkbox" id="absorptionToggle"> MLA Absorption
          </label>
        </div>
      </div>

      <div class="field" id="idxTpField" style="display:none">
        <label>Indexer TP <span class="field-hint" id="idxTpHint"></span></label>
        <input class="text-input" type="number" id="idxTpInput" value="8" min="1" max="256" step="1">
      </div>

      <div class="field-sep"></div>

      <div class="field">
        <label>GPU</label>
        <select class="select-input" id="gpuSelect"></select>
      </div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="total-display">
        <div class="total-value" id="totalPerGpu">&mdash;</div>
        <div class="total-unit" id="totalUnit"></div>
      </div>
      <div class="unit-selector">
        <button class="unit-btn active" data-unit="gib">GiB</button>
        <button class="unit-btn" data-unit="gb">GB</button>
        <button class="unit-btn" data-unit="mib">MiB</button>
      </div>
      <div id="ibarSection" class="ibar-section"></div>
      <div id="gpuFitSection"></div>
      <div class="metrics-compact" id="metricsCompact"></div>
      <div id="formulaSection" class="formula-section hidden">
        <div class="formula-title" id="formulaTitle"></div>
        <div id="formulaBody"></div>
      </div>
      <div id="topologySection"></div>
      <div id="stageSection"></div>
      <div class="breakdown" id="breakdownSection">
        <div class="breakdown-title" id="breakdownToggle">Breakdown <span class="breakdown-arrow">▶</span></div>
        <div class="breakdown-list collapsed" id="breakdownGrid"></div>
      </div>
      <div class="note" id="noteSection"></div>
      <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/calc_weight.js"></script>
<script src="js/calc_deploy.js"></script>
<script src="js/deploy.js"></script>
</body>
</html>
