<div class="shell">
  <div class="grid">
    <div class="form-card">
      <div class="field">
        <label>Select models</label>
        <div class="preset-btns" id="presetBtns">
          <button class="preset-btn" data-preset="top5">Top 5 Models</button>
          <button class="preset-btn" data-preset="deepseek">DeepSeek Family</button>
          <button class="preset-btn" data-preset="qwen">All Qwen</button>
        </div>
        <div class="model-picker" id="modelPicker"></div>
      </div>
      <div class="selected-tags-row">
        <div class="selected-tags" id="selectedTags"></div>
        <button class="tag-clear-btn" id="tagClearBtn" title="Clear all models">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>

      <div class="field">
        <label>KV precision</label>
        <div class="seg-control" id="precSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field hidden" id="idxPrecField">
        <label>Indexer precision</label>
        <div class="seg-control" id="idxPrecSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option" data-value="fp8_int8">FP8</button>
          <button class="seg-option active" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field">
        <label>Sequences</label>
        <input type="number" id="seq" value="1" min="1" step="1">
      </div>

      <div class="field hidden" id="draftField">
        <label class="toggle-label">
          Include draft KV cache
          <button class="toggle" id="draftToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint" id="draftHint">Adds model-specific MTP/draft KV layers when enabled by the serving stack.</div>
      </div>

      <div class="field hidden" id="linearField">
        <label class="toggle-label">
          Include linear attention KV cache
          <button class="toggle" id="linearToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint">Adds linear attention layers' KV cache contribution.</div>
      </div>

      <div class="field">
        <label for="chartTitle">Chart title</label>
        <input type="text" id="chartTitle" class="text-input" value="KV Cache Comparison">
      </div>
      <div class="field">
        <label for="xMax">X axis max</label>
        <select id="xMax">
          <option value="100000">100K</option>
          <option value="200000">200K</option>
          <option value="500000">500K</option>
          <option value="1000000" selected>1M</option>
          <option value="2000000">2M</option>
        </select>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-wrapper">
        <canvas id="chartCanvas"></canvas>
        <div id="emptyState" class="chart-empty">Select one or more models to begin comparison</div>
      </div>
      <div class="chart-actions">
        <button id="btnDownload"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG</button>
        <button id="btnCopy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
