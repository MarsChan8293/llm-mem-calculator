<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV Cache Size Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand"><span class="nav-brand-dot"></span> KV Cache Calculator</span>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab active">Calculator</a>
      <a href="compare.html" class="nav-tab">Compare</a>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</nav>
<div class="shell">
  <div class="grid">
    <div class="form-card">
      <div class="field">
        <label>Select model</label>
        <div class="model-picker" id="modelPicker"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>

      <div class="field">
        <label>Context length</label>
        <input type="text" class="num-input-lg" id="tokens" value="1,024" inputmode="numeric">
        <input type="range" class="range-slider" id="tokensSlider" min="1" max="1048576" value="1024">
      </div>

      <div class="field">
        <label>Batch size</label>
        <div class="batch-btns">
          <button class="batch-btn active" data-value="1">1</button>
          <button class="batch-btn" data-value="4">4</button>
          <button class="batch-btn" data-value="8">8</button>
          <button class="batch-btn" data-value="32">32</button>
          <input type="number" class="batch-custom" id="seq" value="1" min="1" placeholder="Custom">
        </div>
      </div>

      <div class="field">
        <label>KV precision</label>
        <div class="seg-control" id="precSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field hidden" id="idxPrecField">
        <label>Indexer precision</label>
        <div class="seg-control" id="idxPrecSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option" data-value="fp8_int8">FP8</button>
          <button class="seg-option active" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field hidden" id="draftField">
        <label class="toggle-label">
          Draft KV cache
          <button class="toggle" id="draftToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint" id="draftHint">Adds MTP/draft KV layers when enabled by the serving stack.</div>
      </div>

      <div class="field hidden" id="linearField">
        <label class="toggle-label">
          Linear attention KV cache
          <button class="toggle" id="linearToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint">Adds linear attention layers' KV cache contribution.</div>
      </div>
    </div>

    <div class="result-area">
      <div class="total-display">
        <div class="total-value" id="totalValue">&mdash;</div>
        <div class="total-unit" id="totalUnit">GiB</div>
      </div>
      <div class="unit-selector">
        <button class="unit-btn active" data-unit="gib">GiB</button>
        <button class="unit-btn" data-unit="gb">GB</button>
        <button class="unit-btn" data-unit="mib">MiB</button>
      </div>
      <div class="metrics-compact" id="metricsCompact"></div>
      <div id="formulaSection" class="formula-section hidden">
        <div class="formula-title" id="formulaTitle"></div>
        <div id="formulaBody"></div>
      </div>
      <div class="breakdown" id="breakdownSection">
        <div class="breakdown-title">Breakdown</div>
        <div class="breakdown-list" id="breakdownGrid"></div>
      </div>
      <div class="note" id="noteSection"></div>
      <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/calculator.js"></script>
</body>
</html>
