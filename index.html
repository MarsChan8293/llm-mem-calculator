<div class="shell">
  <div class="grid">
    <div class="form-card">
      <div class="field">
        <label>Select model</label>
        <div class="model-picker" id="modelPicker"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>

      <div class="field">
        <label>Context length</label>
        <input type="text" class="num-input-lg" id="tokens" value="1,024" inputmode="numeric">
        <div class="token-presets" id="tokenPresets">
          <button class="token-preset active" data-value="1024">1K</button>
          <button class="token-preset" data-value="2048">2K</button>
          <button class="token-preset" data-value="4096">4K</button>
          <button class="token-preset" data-value="8192">8K</button>
          <button class="token-preset" data-value="16384">16K</button>
          <button class="token-preset" data-value="32768">32K</button>
          <button class="token-preset" data-value="65536">64K</button>
          <button class="token-preset" data-value="131072">128K</button>
          <button class="token-preset" data-value="262144">256K</button>
          <button class="token-preset" data-value="524288">512K</button>
          <button class="token-preset" data-value="1048576">1M</button>
        </div>
      </div>

      <div class="field">
        <label>Batch size</label>
        <div class="batch-btns">
          <button class="batch-btn active" data-value="1">1</button>
          <button class="batch-btn" data-value="4">4</button>
          <button class="batch-btn" data-value="8">8</button>
          <button class="batch-btn" data-value="32">32</button>
          <input type="number" class="batch-custom" id="seq" value="1" min="1" placeholder="Custom">
        </div>
      </div>

      <div class="field">
        <label>KV precision</label>
        <div class="seg-control" id="precSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field hidden" id="idxPrecField">
        <label>Indexer precision</label>
        <div class="seg-control" id="idxPrecSeg">
          <button class="seg-option" data-value="bf16_fp16">BF16</button>
          <button class="seg-option active" data-value="fp8_int8">FP8</button>
          <button class="seg-option" data-value="fp4_int4">FP4</button>
        </div>
      </div>

      <div class="field hidden" id="draftField">
        <label class="toggle-label">
          Draft KV cache
          <button class="toggle" id="draftToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint" id="draftHint">Adds MTP/draft KV layers when enabled by the serving stack.</div>
      </div>

      <div class="field hidden" id="linearField">
        <label class="toggle-label">
          Linear attention KV cache
          <button class="toggle" id="linearToggle" role="switch" aria-checked="false">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </button>
        </label>
        <div class="field-hint">Adds linear attention layers' KV cache contribution.</div>
      </div>
    </div>

    <div class="result-area">
      <div class="total-display">
        <div class="total-value" id="totalValue">&mdash;</div>
        <div class="total-unit" id="totalUnit">GiB</div>
      </div>
      <div class="unit-selector">
        <button class="unit-btn active" data-unit="gib">GiB</button>
        <button class="unit-btn" data-unit="gb">GB</button>
        <button class="unit-btn" data-unit="mib">MiB</button>
      </div>
      <div class="metrics-compact" id="metricsCompact"></div>
      <div id="formulaSection" class="formula-section hidden">
        <div class="formula-title" id="formulaTitle"></div>
        <div id="formulaBody"></div>
      </div>
      <div class="breakdown" id="breakdownSection">
        <div class="breakdown-title" id="breakdownToggle">Breakdown <span class="breakdown-arrow">▶</span></div>
        <div class="breakdown-list collapsed" id="breakdownGrid"></div>
      </div>
      <div class="note" id="noteSection"></div>
      <a class="source-link" id="sourceLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<div class="cheatsheet-overlay" id="cheatsheetOverlay">
  <div class="cheatsheet" id="cheatsheet">
    <div class="cheatsheet-header">
      <span>Symbol Reference</span>
      <button class="cheatsheet-close" id="cheatsheetClose">&times;</button>
    </div>
    <div class="cheatsheet-body" id="cheatsheetBody"></div>
    <div class="cheatsheet-footer">Press <kbd>?</kbd> to close</div>
  </div>
</div>

<script src="js/data.js"></script>
